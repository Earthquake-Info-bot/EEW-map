  <style>
    html, body {
      margin:0; padding:0; height:100%;
    }
    #map {
      width:100%; height:100%;
    }
    .shindo-legend {
      position: absolute;
      bottom: 150px;
      right: 10px;
      z-index: 1000;
      display: none;  /* ←ここで初期非表示 */
      flex-direction: column;
      width: 100px;
      border: 3px solid #000;
      font-weight: bold;
      text-align: center;
    }
    .shindo-legend .row {
      padding: 2px 0;
      margin: 1px 0;
      color: #000;
      background-color: #ccc; /* デフォルト凡例背景 */
    }
    
    /* 色分け */
    .shindo-legend .row[data-shindo="7"] { background-color: rgba(180,0,104,0.9); color: #fff; }
    .shindo-legend .row[data-shindo="6強"] { background-color: rgba(165,0,33,0.9); color: #fff; }
    .shindo-legend .row[data-shindo="6弱"] { background-color: rgba(255,40,0,0.9); color: #fff; }
    .shindo-legend .row[data-shindo="5強"] { background-color: rgba(255,153,0,0.9); color: #fff; }
    .shindo-legend .row[data-shindo="5弱"] { background-color: rgba(255,230,0,0.9); color: #000; }
    .shindo-legend .row[data-shindo="4"] { background-color: rgba(255,230,150,0.9); color: #000; }
    
    /* ヘッダは灰背景 */
    .shindo-legend .row.header { background-color: #ccc; }

    #cancelOverlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(100,100,100,0.6); /* グレー */
      display:none;
      align-items:center;
      justify-content:center;
      z-index:5000;
    }
    
    .cancelBox{
      background:#b8ffb8; /* 薄緑 */
      padding:20px 30px;
      font-size:30px;
      font-weight:bold;
      text-align:center;
      border-radius:10px;
      font-family:'Yu Gothic','Meiryo',sans-serif;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
      line-height:1.1;
    }
  </style>
</head>

  if(countLabel) countLabel.remove();

  const pText = pCount !== "-100" ? `<span style="color:#1976d2;">あと${Math.ceil(pCount)}秒</span>` : '';
  const sText = sCount !== "-100" ? `<span style="color:#d32f2f;">あと${Math.ceil(sCount)}秒</span>` : '';

  const html = `
    <div style="
      display:flex;
      flex-direction:column;
      font-family:'Yu Gothic','YuGothic','Meiryo',sans-serif;
      font-weight:bold;
      text-align:left;
      font-size:20px;
    ">
      ${pText}
      ${sText}
    </div>
  `;

  countLabel = L.marker([lat, lon], {
    icon: L.divIcon({
      className:'',
      html: html,
      iconSize: [200,100],
      iconAnchor: [-15, 15]
    }),
    interactive:false
  }).addTo(map);
}

// fetch & 初期描画
async function fetchEEW(){
  try{
    const res = await fetch(EEW_JSON_URL);
    if(!res.ok) throw new Error("fetch failed");
    const data = await res.json();

    // 発表時刻
    announcedTime = new Date(data.AnnouncedTime.replace(/-/g,"/"));
    const elapsedSec = (new Date() - announcedTime) / 1000;

    if(elapsedSec > 5*60 && data.isFinal){
      // infoBoxに表示
      const infoBox = document.getElementById("infoBox");
      infoBox.innerHTML = "<b>緊急地震速報は<br>発表されていません。</b>";
      infoBox.style.background = "rgba(180, 255, 180, 0.9)";
      infoBox.style.color = "#000";

      // マーカー・円を削除
      if(marker && map.hasLayer(marker)) map.removeLayer(marker);
      marker = null;
      if(pCircle && map.hasLayer(pCircle)) map.removeLayer(pCircle);
      pCircle = null;
      if(sCircle && map.hasLayer(sCircle)) map.removeLayer(sCircle);
      sCircle = null;
      if(countLabel) countLabel.remove();
      countLabel = null;

      // 津波注意も消す
      document.getElementById("tsunamiBox").style.display = "none";
      document.getElementById("warnArea").style.display = "none";
      return; // 以降の処理を中断
    }

    const cancelOverlay = document.getElementById("cancelOverlay");

    if(data.isCancel){
      cancelOverlay.style.display = "flex";
      if(marker && map.hasLayer(marker)) map.removeLayer(marker);
      marker = null;
      if(pCircle && map.hasLayer(pCircle)) map.removeLayer(pCircle);
      pCircle = null;
      if(sCircle && map.hasLayer(sCircle)) map.removeLayer(sCircle);
      sCircle = null;
      if(countLabel) countLabel.remove();
      countLabel = null;
    }else{
      cancelOverlay.style.display = "none";
    }

    const newLat = data.Latitude;
    const newLon = data.Longitude;
    const newDepth = data.Depth;
    originTime = new Date(data.OriginTime.replace(/-/g,"/"));
    t = (new Date() - originTime) / 1000;

    if (newLat==null || newLon==null) return;
    if (eventID !== data.EventID) isFirstView = true;
    eventID = data.EventID;

    lat = newLat;
    lon = newLon;
    depth = newDepth;

    // マーカー
    if(!marker){
      marker = L.marker([lat, lon], {icon: crossIcon, interactive:false}).addTo(map);
    } else {
      marker.setLatLng([lat, lon]);
    }

    // ===== 円 =====
    t = (new Date() - originTime) / 1000;
    const pR = calcSurfaceRadius(P_SPEED, t, depth);
    const sR = calcSurfaceRadius(S_SPEED, t, depth);

    // P波（常に描画）
    if (!pCircle && pR != null) {
      pCircle = L.circle([lat, lon], {
        radius: pR,
        color: "#1976d2",
        weight: 2,
        fill: false
      }).addTo(map);
    } else if (pCircle && pR != null) {
      pCircle.setLatLng([lat, lon]); // ← これを追加
      pCircle.setRadius(pR);
    }
     // 初回のみP波円に合わせてズーム
    if (isFirstView) {
      map.fitBounds(pCircle.getBounds(), {padding:[50,50]});
      isFirstView = false;
    }

    // S波（地表に出てから描画）
    if (sR > 0 && !sCircle) {
      sCircle = L.circle([lat, lon], {
        radius: sR,
        color: "#d32f2f",
        weight: 2,
        fill: false
      }).addTo(map);
    } else if (sR > 0 && sCircle) {
      sCircle.setLatLng([lat, lon]); // ← 追加
      sCircle.setRadius(sR);
    }
    sCR = sR;

    if (pR <= 0) {
      pCount = depth / P_SPEED - t; // 残り秒数
      if (pCount < 0) pCount = "-100";
    } else {
      pCount = "-100";
    }

    if (sR <= 0) {
      sCount = depth / S_SPEED - t;
      if (sCount < 0) sCount = "-100";
    } else {
      sCount = "-100";
    }

    if (isFirstView) {
      map.setView([lat, lon], 7);
      isFirstView = false;
    }

    updateCountLabel(lat, lon, pCount, sCount);
    updateInfoBox(data); // ← ここを追加
    await updateWarnAreaGeo(data);
  } catch(e){
    console.warn(e);
  }
}

async function updateWarnAreaGeo(data) {
  if (isUpdatingWarnArea) return;   // ← 競合防止
  isUpdatingWarnArea = true;

  const legend = document.getElementById('shindo-legend');
  legend.style.display = 'none';

  try {

    if (!data.WarnArea) return;

    const newChiikiSet = new Set(
      data.WarnArea.map(a => a.Chiiki)
    );

    // ==========================
    // ① 消す処理（縮小対応 → 透明化）
    // ==========================
    for (const chiiki in wroteWarnArea) {
      if (!newChiikiSet.has(chiiki)) {
        const areaObj = wroteWarnArea[chiiki];
        areaObj.layer.setStyle({
          fillColor: "rgba(0,0,0,0)",
          color: "rgba(0,0,0,0)",
          fillOpacity: 0
        });
        areaObj.hidden = true;
      }
    }

    // ==========================
    // ② 追加・震度変化対応
    // ==========================
    for (const area of data.WarnArea) {
      const chiiki = area.Chiiki;
      const shindo = area.Shindo1;
      const code = areaCode[chiiki];
      if (!code) continue;

      // --- 新規地域 ---
      if (!wroteWarnArea[chiiki]) {
        const layer = await loadAndDrawGeoJSON(code, shindo);
        wroteWarnArea[chiiki] = {
          shindo: shindo,
          code: code,
          layer: layer,
          hidden: false
        };
        continue;
      }

      // --- 震度変化 or 復活 ---
      const areaObj = wroteWarnArea[chiiki];
      if (areaObj.shindo !== shindo || areaObj.hidden) {
        areaObj.shindo = shindo;
        const color = getShindoColor(shindo);
        areaObj.layer.setStyle({
          color: color,
          fillColor: color,
          fillOpacity: 1
        });
        areaObj.hidden = false;
      }
    }

  } finally {
    if (data.WarnArea.length > 0) legend.style.display = 'flex';
    isUpdatingWarnArea = false;  // ← 必ず最後に解除
  }
}

async function loadAndDrawGeoJSON(code, shindo) {
  if (!code) return;

  // 既に描画済みなら再追加だけ
  if (geoLayerCache[code]) {
    const layer = geoLayerCache[code];
    map.addLayer(layer);
    return layer;
  }

  // まだfetchしてないなら取得
  if (!geoCache[code]) {
    //const url = `https://geoshape.ex.nii.ac.jp/jma/resource/AreaForecastLocalE/20240520/${code}.geojson`;
    const url = `./geojson/${code}.json`;
    const res = await fetch(url);
    if (!res.ok) return;

    let geo = await res.json();

    // 簡略化
    geo = turf.simplify(geo, {
      tolerance: 0.005,  // 数値を大きくするとより簡略化、速くなる
      highQuality: false  // 高品質オプションOFFでさらに処理速く
    });

    geoCache[code] = geo;
  }

  // Canvasで描画
  const color = getShindoColor(shindo);
  
  const layer = L.geoJSON(geoCache[code], {
    renderer: canvasRenderer,
    style: {
      color: color,
      weight: 2,
      fillColor: color,
      fillOpacity: 1
    },
    interactive: false
  });

  geoLayerCache[code] = layer;
  layer.addTo(map);
  return layer;
}

// 半径計算（※描画とは別）
function calcSurfaceRadius(speed, timeSec, depthKm){
  const d = speed * timeSec;
  if (d <= depthKm) return 0;
  return Math.sqrt(d*d - depthKm*depthKm) * 1000;
}

function updateInfoBox(data) {
  const infoBox = document.getElementById("infoBox");
  const warnArea = document.getElementById("warnArea");
  if (!data) return;

  //震源情報
  const title = data.Title || "緊急地震速報";
  const plum = data.isAssumption ? "  /  PLUM報" : "";
  const hypocenter = data.Hypocenter || "-";
  let lt = (data.Latitude != null) ? Math.abs(data.Latitude) : "--";
  let ln = (data.Longitude != null) ? Math.abs(data.Longitude) : "--";
  if (data.Latitude > 0) lt = "N" + lt;
  else if (data.Latitude < 0) lt = "S" + lt;
  if (data.Longitude > 0) ln = "E" + ln;
  else if (data.Longitude < 0) ln = "W" + ln;

  const maxInt = data.MaxIntensity || "不明";
  let mag = "M" + (data.Magunitude ?? "不明");
  let depth = data.Depth || "不明";
  let depthKm = " km";
  if (data.isAssumption) {
    mag = "推定なし";
    depth = "推定なし";
    depthKm = "";
  }
  const serial = data.Serial || "-";
  const lastSerial = data.isFinal ? "(最終)" : "";
  const orgin = data.OriginTime || "----/--/-- --:--:--";
  const announce = data.AnnouncedTime || "----/--/-- --:--:--";
  const isSea = data.isSea ? "海域地震" : "内陸地震";
  const accE = data.Accuracy?.Epicenter || "不明";
  const accD = data.Accuracy?.Depth || "不明";
  const accM = data.Accuracy?.Magnitude || "不明";

  infoBox.innerHTML = `
    #第${serial}${lastSerial}報${plum}<br>
    ${orgin}発生<br>
    <b style="font-size:26px">${title}</b><br><br>
    震源地<br>
    　<b style="font-size:30px">${hypocenter}</b><br>
    　<b style="font-size:16px">${lt}º${ln}º／${isSea}</b><br>
    推定最大震度<br>
    　<b style="font-size:30px">${maxInt}</b><br>
    マグニチュード<br>
    　<b style="font-size:30px">${mag}</b><br>
    震源の深さ<br>
    　<b style="font-size:30px">${depth}</b>${depthKm}<br>
    <br>
    <span style="font-size:14px">精度に関する情報<br>
    震央　<b>${accE}</b><br>
    深さ　<b>${accD}</b><br>
    　Ｍ　<b>${accM}</b><br>
    <br>
    発表時刻 ${announce}<br>
    NAFY緊急地震速報マップ<br>
    情報元：WolfxAPI／地図データ：気象庁<br></span>
    <span style="font-size:12px">P/S波は簡易モデルによる計算であり、<br>
    実際と異なる場合があります。</span>
  `;

  if (maxInt === "7") { bg = "rgba(180,0,104,0.9)"; tc = "#fff"; }
  else if (maxInt === "6強") { bg = "rgba(165,0,33,0.9)"; tc = "#fff"; }
  else if (maxInt === "6弱") { bg = "rgba(255,40,0,0.9)"; tc = "#fff"; }
  else if (maxInt === "5強") { bg = "rgba(255,153,0,0.9)"; tc = "#fff"; }
  else if (maxInt === "5弱") { bg = "rgba(255,230,0,0.9)"; tc = "#000"; }
  else if (maxInt === "4") { bg = "rgba(255,230,150,0.9)"; tc = "#000"; }
  else if (maxInt === "3") { bg = "rgba(0,65,255,0.9)"; tc = "#fff"; }
  else if (maxInt === "2") { bg = "rgba(0,170,255,0.9)"; tc = "#fff"; }
  else if (maxInt === "1") { bg = "rgba(242,242,255,0.9)"; tc = "#000"; }
  else { bg = "rgba(211, 211, 211, 0.9)"; tc = "#000"; }

  infoBox.style.background = bg;
  infoBox.style.color = tc;

  if (data.isTraining) {
    trainingBox.innerHTML = '訓練<span style="font-size:24px;"><br>Drill</span>';
    trainingBox.style.background = "rgb(255,0,0)";
  } else {
    trainingBox.innerHTML = "";
    trainingBox.style.background = "rgba(255,0,0,0)";
  }

  tsunamiBox.style.display = "none";
  tsunamiChuui = false;

  if (data.isSea && data.Depth <= 60) {
    if (data.isWarn || data.Magunitude >= 6.5) {
      tsunamiChuui = true;
      tsunamiBox.innerHTML = `
        <div>
          <div style="font-size:22px;font-weight:bold;">津波に注意</div>
          <div style="margin-top:6px;font-size:14px;">
            沿岸で長く強い揺れを感じた場合は、<br>
            津波が襲来する可能性があります<br>
            念のため海や川から離れてください<br>
            ［今後の情報に注意］
          </div>
        </div>
      `;
      requestAnimationFrame(() => { tsunamiBox.style.display = "block"; });
    }
  }

  let alertHeader = "";
  if (data.isWarn) {
    const prefSet = new Set();
    for (const { Chiiki } of data.WarnArea) {
      for (const [pref, areas] of Object.entries(regionMap)) {
        if (areas.some(a => Chiiki.includes(a))) prefSet.add(pref);
      }
    }

    const headerParts = [];
    for (const [chiho, subareas] of Object.entries(chihoMap)) {
      const matchedCount = subareas.filter(pref => prefSet.has(pref)).length;
      if (matchedCount === subareas.length) {
        headerParts.push(chiho);
      } else {
        subareas.forEach(pref => {
          if (prefSet.has(pref) && !headerParts.includes(pref)) headerParts.push(pref);
        });
      }
    }

    const sortedHeaderParts = regionOrder1.filter(r => headerParts.includes(r))
      .concat(headerParts.filter(r => !regionOrder1.includes(r)));

    // ▼ 対象地域（地方）抽出
    const regionSet = new Set();
  
    for (const { Chiiki } of data.WarnArea) {
      for (const [region, areas] of Object.entries(regionMap)) {
        if (areas.some(area => Chiiki.includes(area))) {
          regionSet.add(region);
        }
      }
    }
    
    const sortedRegions = regionOrder2.filter(r => regionSet.has(r));

    warnArea.innerHTML = `
      <span style="font-weight:normal; font-size:20px; background:#ffff00; color:#ff0000">
        強い揺れに警戒。姿勢を低くして頭を守ってください
      </span><br>
      <div style="font-size:28px; line-height:1.2;">
        ${sortedHeaderParts.map(r => `<span style="white-space: nowrap; margin-right:20px;">${r}</span>`).join('')}
      </div>
    `;

    lastWarnArea = sortedHeaderParts;

    if (data.isWarn) document.getElementById("warnArea").style.display = "block";
    else document.getElementById("warnArea").style.display = "none";
  } // ← ここで isWarn の if を閉じる
} // ← ここで関数全体を閉じる

function getShindoColor(shindo) {
  if (shindo === "7") return "rgba(180,0,104,0.9)";
  else if (shindo === "6強") return "rgba(165,0,33,0.9)";
  else if (shindo === "6弱") return "rgba(255,40,0,0.9)";
  else if (shindo === "5強") return "rgba(255,153,0,0.9)";
  else if (shindo === "5弱") return "rgba(255,230,0,0.9)";
  else if (shindo === "4") return "rgba(255,230,150,0.9)";
  else if (shindo === "3") return "rgba(0,65,255,0.9)";
  else if (shindo === "2") return "rgba(0,170,255,0.9)";
  else if (shindo === "1") return "rgba(242,242,255,0.9)";
  else return "rgba(128,128,128,0.9)";
}  

// アニメーション（S波は存在してから）
setInterval(()=>{
  if (pCircle && pCircle.getRadius() > 0) {
    pCircle.setRadius(pCircle.getRadius() + P_STEP);
  }
  if (sCircle && sCircle.getRadius() > 0) {
    if (sCR > 0) {
      sCircle.setRadius(sCircle.getRadius() + S_STEP);
    } else {
      sCircle.remove(); // 地図から削除
      sCircle = null;   // 変数もリセット
    }
  }
}, ANIM_INTERVAL);

// fetch
fetchEEW();
setInterval(fetchEEW, FETCH_INTERVAL);
</script>
